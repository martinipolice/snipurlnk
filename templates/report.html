<!DOCTYPE html>

<html lang="en">

    <head>
        <title>Report a link - snipURlnk</title>
        {% include "_head.html" %}
    </head>

    <body class="p-dark-mode">
        {% include "_header.html" %}

        <main>
            <div class="page-title">
                <div>
                    <h1>Report a link</h1>
                    <p>Seen a short link pointing somewhere harmful? Tell us and we'll review it.</p>
                </div>
            </div>

            <section aria-label="Report form">
                <div class="field-group">
                    <label for="linkInput">Short link or code</label>
                    <input class="field" type="text" id="linkInput" autocomplete="off" spellcheck="false"
                           placeholder="{{ request.host }}/abc123" aria-describedby="linkError">
                    <p class="field-error" id="linkError"></p>
                </div>

                <div class="field-group">
                    <label for="reasonInput">Reason <span class="optional">optional</span><span class="counter" id="reasonCount" aria-hidden="true">0/200</span></label>
                    <input class="field" type="text" id="reasonInput" maxlength="200" placeholder="Phishing, malware, spam…">
                </div>

                <button type="button" class="btn btn-primary btn-block btn-large" id="reportBtn">Send report</button>
                <div id="result" aria-live="polite"></div>
            </section>

            <footer class="page-footer">
                <a href="{{ url_for('home') }}">Back to snipURlnk</a>
            </footer>
        </main>

        <script>
        const linkInput = document.getElementById("linkInput");
        const reasonInput = document.getElementById("reasonInput");
        const reasonCount = document.getElementById("reasonCount");
        const reportBtn = document.getElementById("reportBtn");
        const result = document.getElementById("result");
        const linkError = document.getElementById("linkError");
        const ICONS = "{{ url_for('static', filename='icons.svg') }}";

        // The server answers in short phrases; these two belong next to the link field.
        const LINK_ERRORS = {
            "Missing link": "Paste the short link you want to report.",
            "Link not found": "We couldn't find a live link with that code. Check it and try again."
        };

        function icon(name) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("class", "icon");
            svg.setAttribute("aria-hidden", "true");
            const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
            use.setAttribute("href", ICONS + "#i-" + name);
            svg.appendChild(use);
            return svg;
        }

        function showAlert(kind, message) {
            const box = document.createElement("div");
            box.className = "alert alert-" + kind;
            if (kind === "error") box.setAttribute("role", "alert");
            const text = document.createElement("span");
            text.textContent = message;
            box.append(icon(kind === "error" ? "alert" : "check"), text);
            result.replaceChildren(box);
        }

        function clearErrors() {
            linkInput.removeAttribute("aria-invalid");
            linkError.textContent = "";
            result.replaceChildren();
        }

        reasonInput.addEventListener("input", function () {
            reasonCount.textContent = reasonInput.value.length + "/200";
        });

        linkInput.addEventListener("input", function () {
            if (linkInput.getAttribute("aria-invalid")) clearErrors();
        });

        [linkInput, reasonInput].forEach(function (input) {
            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") reportBtn.click();
            });
        });

        reportBtn.addEventListener("click", async function () {
            if (reportBtn.disabled) return;
            clearErrors();
            reportBtn.disabled = true;
            reportBtn.textContent = "Sending…";

            let response;
            try {
                response = await fetch("/report", {
                    method: "POST",
                    body: new URLSearchParams({ link: linkInput.value, reason: reasonInput.value })
                });
            } catch (error) {
                response = null;
            }

            const text = response ? await response.text() : "";
            reportBtn.disabled = false;
            reportBtn.textContent = "Send report";

            if (!response) {
                showAlert("error", "Network error. Check your connection and try again.");
            } else if (response.status >= 500) {
                // A 500 comes back as an HTML page, which must not be shown as text
                showAlert("error", "Something went wrong on our side. Please try again.");
            } else if (response.ok) {
                showAlert("success", text);
                linkInput.value = "";
                reasonInput.value = "";
                reasonCount.textContent = "0/200";
            } else if (LINK_ERRORS[text]) {
                linkInput.setAttribute("aria-invalid", "true");
                linkError.replaceChildren(icon("alert"), document.createTextNode(LINK_ERRORS[text]));
                linkInput.focus();
            } else {
                showAlert("error", text);
            }
        });
        </script>

    </body>

</html>
