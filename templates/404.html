<!DOCTYPE html>

<html lang="en">

    <head>
        <title>Link not found - snipURlnk</title>
        {% include "_head.html" %}
    </head>

    <body class="p-dark-mode">
        {% include "_header.html" %}

        <main class="not-found">
            <img src="{{ url_for('static', filename='mascot.png') }}" alt="" width="176" height="176">
            <p class="eyebrow">404</p>
            <h1>Link not found</h1>
            <p>This link doesn't exist, or it was removed.</p>

            <p id="countdownStatus" class="visually-hidden" role="status"></p>
            <div id="countdown" class="countdown"></div>

            <div class="button-row">
                <a id="homeLink" class="btn btn-primary" href="{{ url_for('home') }}">Go to snipURlnk now</a>
                <a class="btn" href="/report">Report a link</a>
            </div>
        </main>

        <script>
        const START_SECONDS = 10;
        const countdown = document.getElementById("countdown");
        const countdownStatus = document.getElementById("countdownStatus");
        const homeLink = document.getElementById("homeLink");

        let secondsLeft = START_SECONDS;

        const countdownText = document.createElement("p");
        countdownText.setAttribute("aria-hidden", "true");

        // A bar that empties over the countdown (hidden when the visitor asks for less motion)
        const bar = document.createElement("div");
        bar.className = "countdown-bar";
        bar.setAttribute("aria-hidden", "true");
        bar.appendChild(document.createElement("span"));

        const stopButton = document.createElement("button");
        stopButton.type = "button";
        stopButton.className = "btn btn-ghost btn-small";
        stopButton.textContent = "Stop countdown";

        countdown.append(countdownText, bar, stopButton);
        countdownStatus.textContent = "You will be taken to the home page in " + START_SECONDS +
            " seconds. Use the Stop countdown button to stay on this page.";

        function showSeconds() {
            countdownText.textContent = "Taking you to the home page in " + secondsLeft + " seconds...";
        }
        showSeconds();

        const timer = setInterval(function () {
            secondsLeft -= 1;
            if (secondsLeft <= 0) {
                clearInterval(timer);
                window.location.href = homeLink.href;
                return;
            }
            showSeconds();
        }, 1000);

        stopButton.addEventListener("click", function () {
            clearInterval(timer);
            countdownText.removeAttribute("aria-hidden");
            countdownText.textContent = "Countdown stopped. You can stay on this page.";
            stopButton.remove();
            bar.remove();
            countdownStatus.textContent = "";
            homeLink.focus();
        });
        </script>

    </body>

</html>
