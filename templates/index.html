<!DOCTYPE html>

<html>

    <head>
        <title>snipURlnk</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codedgar/puppertino@2.0.0/dist/css/puppertino.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>

    <body class="p-auto-dark-mode">
        <main>
            <h1>snipURlnk</h1>
            <p>Paste a long link, get a short one.</p>
            <input class="p-field" type="text" id="urlInput" placeholder="Paste a long URL" aria-label="Long URL">
            <input class="p-field" type="text" id="aliasInput" placeholder="Custom alias (optional)" aria-label="Custom alias">
            <button class="p-button p-button-primary" id="shortenBtn">Shorten</button>
            <div id="result" aria-live="polite"></div>
            <p><a href="{{ url_for('report_page') }}">Report a link</a></p>
        </main>

        <dialog id="qrDialog" aria-labelledby="qrTitle">
            <h2 id="qrTitle">QR code</h2>
            <canvas id="qrCanvas" role="img" aria-label="QR code"></canvas>
            <p id="qrLink"></p>
            <button type="button" class="p-button p-button-primary" id="qrDownload">Download PNG</button>
            <button type="button" class="p-button p-button-default" id="qrShare">Share</button>
            <button type="button" class="p-button p-button-default" id="qrCopy">Copy link</button>
            <button type="button" class="p-button p-button-default" id="qrClose">Close</button>
            <p id="qrMessage" role="status"></p>
        </dialog>

        <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
                integrity="sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A="
                crossorigin="anonymous"></script>

        <script>
        const urlInput = document.getElementById("urlInput");
        const aliasInput = document.getElementById("aliasInput");
        const shortenBtn = document.getElementById("shortenBtn");
        const result = document.getElementById("result");

        const qrDialog = document.getElementById("qrDialog");
        const qrCanvas = document.getElementById("qrCanvas");
        const qrLink = document.getElementById("qrLink");
        const qrMessage = document.getElementById("qrMessage");
        const qrDownload = document.getElementById("qrDownload");
        const qrShare = document.getElementById("qrShare");
        const qrCopy = document.getElementById("qrCopy");
        const qrClose = document.getElementById("qrClose");

        let currentQr = { url: "", code: "" };

        // Browsers without the share menu (like desktop Firefox) don't get a Share button.
        if (!navigator.share) qrShare.remove();

        // Draws black squares on a white canvas, with the 4-square empty border scanners expect.
        function drawQr(text) {
            const qr = qrcode(0, "M");
            qr.addData(text);
            qr.make();

            const quiet = 4;
            const modules = qr.getModuleCount();
            const cell = Math.ceil(520 / (modules + quiet * 2));
            const size = (modules + quiet * 2) * cell;

            qrCanvas.width = size;
            qrCanvas.height = size;
            const ctx = qrCanvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = "#000000";
            for (let row = 0; row < modules; row++) {
                for (let col = 0; col < modules; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillRect((col + quiet) * cell, (row + quiet) * cell, cell, cell);
                    }
                }
            }
        }

        function canvasToBlob() {
            return new Promise(function (resolve) {
                qrCanvas.toBlob(resolve, "image/png");
            });
        }

        function openQr(shortUrl, code) {
            currentQr = { url: shortUrl, code: code };
            qrMessage.textContent = "";
            drawQr(shortUrl);
            qrCanvas.setAttribute("aria-label", "QR code for " + shortUrl);
            qrLink.textContent = shortUrl;
            qrDialog.showModal();
        }

        qrDownload.addEventListener("click", async function () {
            const blob = await canvasToBlob();
            if (!blob) {
                qrMessage.textContent = "Could not make the image.";
                return;
            }
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = objectUrl;
            link.download = "snipurlnk-" + currentQr.code + ".png";
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(function () { URL.revokeObjectURL(objectUrl); }, 1000);
            qrMessage.textContent = "Downloaded.";
        });

        qrShare.addEventListener("click", async function () {
            let shareData = { title: "snipURlnk", url: currentQr.url };
            const blob = await canvasToBlob();
            if (blob) {
                const file = new File([blob], "snipurlnk-" + currentQr.code + ".png", { type: "image/png" });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    shareData = { title: "snipURlnk", text: currentQr.url, files: [file] };
                }
            }
            try {
                await navigator.share(shareData);
            } catch (error) {
                if (error.name !== "AbortError") qrMessage.textContent = "Sharing failed.";
            }
        });

        qrCopy.addEventListener("click", async function () {
            try {
                await navigator.clipboard.writeText(currentQr.url);
                qrMessage.textContent = "Link copied.";
            } catch (error) {
                qrMessage.textContent = "Could not copy the link.";
            }
        });

        qrClose.addEventListener("click", function () {
            qrDialog.close();
        });

        [urlInput, aliasInput].forEach(function (input) {
            input.addEventListener("keydown", function (event) {
                if (event.key === "Enter") shortenBtn.click();
            });
        });

        shortenBtn.addEventListener("click", async function () {
            const longUrl = urlInput.value;
            const alias = aliasInput.value;

            let response;
            try {
                response = await fetch(
                   "/shorten", {
                    method: "POST",
                    body: new URLSearchParams({ url: longUrl, alias: alias })
                    }   
                );
            } catch (error) {
                result.className = "error";
                result.textContent = "Network error";
                return;
            }

            result.className = response.ok ? "" : "error";

            if (!response.ok) {
                result.textContent = await response.text();
                return;
            }

            const code = await response.text();
            const shortUrl = window.location.origin + "/" + code;

            const urlText = document.createElement("span");
            urlText.textContent = shortUrl;

            const copyBtn = document.createElement("button");
            copyBtn.className = "p-button p-button-default";
            copyBtn.textContent = "Copy";

            copyBtn.addEventListener("click", async function () {
                try {
                    await navigator.clipboard.writeText(shortUrl);
                    copyBtn.textContent = "Copied!";      // success message
                } catch (error) {
                    copyBtn.textContent = "Failed";      // failure message
                }

                setTimeout(function () {
                    copyBtn.textContent = "Copy";
                }, 1500);
            });


            const goBtn = document.createElement("button");
            goBtn.className = "p-button p-button-default";
            goBtn.textContent = "Go";
            goBtn.addEventListener("click", function () {
                window.open(shortUrl, "_blank");
            });

            result.textContent = "";
            result.appendChild(urlText);
            result.appendChild(document.createTextNode(" "));
            result.appendChild(copyBtn);
            result.appendChild(document.createTextNode(" "));
            result.appendChild(goBtn);

            // If the QR library didn't load, the page still works, just without this button.
            if (typeof qrcode === "function") {
                const qrBtn = document.createElement("button");
                qrBtn.className = "p-button p-button-default";
                qrBtn.textContent = "QR code";
                qrBtn.addEventListener("click", function () {
                    openQr(shortUrl, code);
                });
                result.appendChild(document.createTextNode(" "));
                result.appendChild(qrBtn);
            }
            });

        </script>

    </body>

</html>
