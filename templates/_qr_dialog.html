<dialog id="qrDialog" aria-labelledby="qrTitle">
    <div class="dialog-head">
        <h2 id="qrTitle">QR code</h2>
        <button type="button" class="btn btn-icon" id="qrClose" aria-label="Close" data-tooltip="Close" data-tooltip-side="left">
            <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#i-close"/></svg>
        </button>
    </div>
    <div class="qr-tile"><canvas id="qrCanvas" role="img" aria-label="QR code"></canvas></div>
    <p id="qrLink"></p>
    <div class="qr-actions">
        <button type="button" class="btn btn-primary" id="qrDownload">
            <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#i-download"/></svg>Download PNG
        </button>
        <button type="button" class="btn" id="qrShare">
            <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#i-share"/></svg>Share
        </button>
        <button type="button" class="btn" id="qrCopy">
            <svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#i-copy"/></svg>Copy link
        </button>
    </div>
    <p id="qrMessage" role="status"></p>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
        integrity="sha256-GK45n4EYK8nekW6cd7GV3yDMWNby1VpisIWimfG/F4A="
        crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='qr.js') }}"></script>
